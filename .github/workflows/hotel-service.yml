name: 🚀 Hotel Service CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    uses: ./.github/workflows/reusable-microservice-build-deploy.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      service-name: hotel-service
      working-directory: backend/services/hotel-service
      dockerfile-path: backend/services/hotel-service/Dockerfile
      repo-image-name: phoenix-hotel-service
    secrets:
      HARBOR_URL: ${{ secrets.HARBOR_URL }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
