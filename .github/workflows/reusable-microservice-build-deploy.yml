name: Reusable Microservice Build and Deploy

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the microservice (e.g., api-gateway, frontend)'
        required: true
        type: string
      working-directory:
        description: 'Path to the service directory relative to repo root'
        required: true
        type: string
      dockerfile-path:
        description: 'Path to the Dockerfile relative to repo root'
        required: true
        type: string
      config-repo-config-file:
        description: 'Path to the config file in the config repository to update'
        required: true
        type: string
      helm-value-path:
        description: 'YQ path to the image tag in Helm values file (e.g., frontend.image.tag)'
        required: false
        type: string
      kustomize-image-name:
        description: 'Full image name (without tag) as defined in Kustomize images section'
        required: false
        type: string
      repo-image-name:
        description: 'Image name for Harbor, e.g., phoenix-frontend-service'
        required: true
        type: string
      target-env:
        description: 'Target environment for deployment (staging or production)'
        required: true
        type: string
      docker-build-args:
        description: 'Multi-line string of build arguments to pass to Docker (e.g., KEY=VALUE)'
        required: false
        type: string
    secrets:
      GH_PAT:
        required: true
      HARBOR_URL:
        required: true
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

jobs:
  quality:
    name: 🔍 Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Test
        run: npm test --if-present

  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.working-directory }}'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: 🐳 Build & Push
    needs: [quality, security]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target-env }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚪 Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: |
            ${{ secrets.HARBOR_URL }}/phoenix-project/${{ inputs.repo-image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ inputs.docker-build-args }}


      - name: 🏗️ Update Config Repo (GitOps)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
          IMAGE_TAG: ${{ github.sha }}
          CONFIG_FILE: ${{ inputs.config-repo-config-file }}
          HELM_VALUE_PATH: ${{ inputs.helm-value-path }}
          TARGET_BRANCH: ${{ inputs.target-env }}
        run: |
          # Install yq
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

          # Configure Git
          git config --global user.email "ci-bot@pheonix.live"
          git config --global user.name "CI Bot"

          # Clone Config Repo
          git clone https://$GH_PAT@github.com/theenuka/pheonix-booking-config-repo.git config-repo
          cd config-repo

          # Checkout the target branch
          git checkout $TARGET_BRANCH

          if [ -f "$CONFIG_FILE" ]; then
            echo "📝 Updating $CONFIG_FILE..."
            if [ -n "$HELM_VALUE_PATH" ]; then
              # Update image tag in Helm values file
              yq -i ".${HELM_VALUE_PATH}" = "$IMAGE_TAG" "$CONFIG_FILE"
            else
              echo "Error: HELM_VALUE_PATH is not provided for GitOps update."
              exit 1
            fi
            
            git add "$CONFIG_FILE"
            git commit -m "🚀 Deploy ${{ inputs.service-name }} to $TARGET_BRANCH: $IMAGE_TAG"
            git push origin $TARGET_BRANCH
          else
            echo "⚠️ Target config file $CONFIG_FILE not found. Skipping GitOps update."
            exit 1 # Fail the step if the config file isn't found
          fi
