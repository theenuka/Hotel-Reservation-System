name: Reusable Microservice Build and Deploy

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the microservice (e.g., api-gateway, frontend)'
        required: true
        type: string
      working-directory:
        description: 'Path to the service directory relative to repo root'
        required: true
        type: string
      dockerfile-path:
        description: 'Path to the Dockerfile relative to repo root'
        required: true
        type: string
      repo-image-name:
        description: 'Image name for Harbor, e.g., phoenix-frontend-service'
        required: true
        type: string
      docker-build-args:
        description: 'Multi-line string of build arguments to pass to Docker (e.g., KEY=VALUE)'
        required: false
        type: string
    secrets:
      HARBOR_URL:
        required: true
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

jobs:
  quality:
    name: 🔍 Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎨 Lint Code
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Run Tests
        run: npm test --if-present

      - name: 📊 Generate Coverage Report
        if: hashFiles(format('{0}/coverage/lcov.info', inputs.working-directory)) != ''
        uses: codecov/codecov-action@v4
        with:
          file: ${{ inputs.working-directory }}/coverage/lcov.info
          flags: ${{ inputs.service-name }}
          name: ${{ inputs.service-name }}-coverage
          fail_ci_if_error: false

  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.working-directory }}'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 📤 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: dependency-scan-${{ inputs.service-name }}

      - name: 🛡️ Run Trivy FS Scan (Blocking on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.working-directory }}'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build:
    name: 🐳 Build & Push
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚪 Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 🏷️ Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_URL }}/phoenix-project/${{ inputs.repo-image-name }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🐳 Build & Push Multi-Arch Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ inputs.docker-build-args }}
          sbom: true
          provenance: true

      - name: 🔍 Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.HARBOR_URL }}/phoenix-project/${{ inputs.repo-image-name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: 📤 Upload Image Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: image-scan-${{ inputs.service-name }}

      - name: 📌 Set Image Tag Output
        id: image_tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
