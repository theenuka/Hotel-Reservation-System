name: 🚀 Identity Service CI/CD

on:
  push:
    branches: ["main", "staging", "production"]
    paths:
      - 'backend/services/identity-service/**'
      - '.github/workflows/identity-service.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/reusable-microservice-build-deploy.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      service-name: identity-service
      working-directory: backend/services/identity-service
      dockerfile-path: backend/services/identity-service/Dockerfile
      repo-image-name: phoenix-identity-service
      config-repo-config-file: environments/${{ github.event.inputs.environment || 'staging' }}/staging-identity-service.yaml
      helm-value-path: identity-service.image.tag
      target-env: ${{ github.event.inputs.environment || 'staging' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      HARBOR_URL: ${{ secrets.HARBOR_URL }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
