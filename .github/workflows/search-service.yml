name: 🚀 Search Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/services/search-service/**'
      - 'shared/**'
      - '.github/workflows/search-service.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/services/search-service/**'
      - 'shared/**'
      - '.github/workflows/search-service.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-microservice-build-deploy.yml
    with:
      service-name: search-service
      working-directory: backend/services/search-service
      dockerfile-path: backend/services/search-service/Dockerfile
      config-repo-config-file: environments/staging/staging-search-service.yaml
      helm-value-path: search-service.image.tag
      repo-image-name: phoenix-search-service
      target-env: staging
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      HARBOR_URL: ${{ secrets.HARBOR_URL }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
