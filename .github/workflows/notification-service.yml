name: 🚀 Notification Service CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-microservice-build-deploy.yml
    with:
      service-name: notification-service
      working-directory: backend/services/notification-service
      dockerfile-path: backend/services/notification-service/Dockerfile
      config-repo-config-file: environments/staging/staging-notification-service.yaml
      helm-value-path: notification-service.image.tag
      repo-image-name: phoenix-notification-service
      target-env: staging
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      HARBOR_URL: ${{ secrets.HARBOR_URL }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
