name: 🚀 API Gateway CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/services/api-gateway/**'
      - 'shared/**'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/services/api-gateway/**'
      - 'shared/**'
      - '.github/workflows/api-gateway.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-microservice-build-deploy.yml
    with:
      service-name: api-gateway
      working-directory: backend/services/api-gateway
      dockerfile-path: backend/services/api-gateway/Dockerfile
      config-repo-config-file: environments/staging/staging-api-gateway.yaml
      helm-value-path: api-gateway.image.tag
      repo-image-name: phoenix-api-gateway-service
      target-env: staging
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      HARBOR_URL: ${{ secrets.HARBOR_URL }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
